project:
  type: book
  output-dir: _site

book:
  title: "AI Safety & Security"
  subtitle: "Foundations to the Agentic Frontier"
  author: "Surafel M. Lakew"
  search: true
  repo-url: https://github.com/surafelml/ai-safety-security
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    width: 280
  chapters:
    - index.qmd
    - part: "I — Foundations"
      chapters:
        - foundations/historical-roots.qmd
        - foundations/landscape.qmd
        - foundations/security-foundations.qmd
        - foundations/agentic-systems.qmd
    - part: "II — Topics"
      chapters:
        - topics/alignment.qmd
        - topics/robustness-security.qmd
        - topics/interpretability.qmd
        - topics/monitoring-oversight.qmd
        - topics/systemic-safety.qmd
        - topics/evaluation.qmd
        - topics/agentic-safety-security.qmd
    - part: "III — Frontier"
      chapters:
        - frontier/index.qmd
    - part: "IV — Supplementary"
      chapters:
        - supplement/technical-notes.qmd
        - supplement/benchmarks.qmd
        - supplement/tooling.qmd
    - references.qmd

bibliography: references.bib
csl: apa.csl

format:
  html:
    theme:
      light: litera
      dark: darkly
    css: assets/styles.css
    toc: true
    number-sections: true
    html-math-method: mathjax
    page-layout: article

browser: true
